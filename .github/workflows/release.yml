name: Release

# Pushing a tag like v0.8.2 builds the Blender add-on zip and publishes it as a GitHub Release asset.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches bl_info version
        run: |
          python - <<'PY'
          import os, re
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          src = open("__init__.py", encoding="utf-8").read()
          m = re.search(r'"version":\s*\((\d+),\s*(\d+),\s*(\d+)\)', src)
          ver = ".".join(m.groups())
          assert tag in (ver, ".".join(ver.split(".")[:2]) if ver.endswith(".0") else ver), f"tag {tag} != bl_info {ver}"
          print("version OK:", ver)
          PY

      - name: Build add-on zip
        run: python package_addon.py --ci

      - name: Extract release notes
        run: |
          python - <<'PY'
          import os, re
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          parts = re.split(r"(?m)^## ", text)
          body = next((p for p in parts if p.startswith(tag)), parts[1] if len(parts) > 1 else text)
          open("RELEASE_NOTES.md", "w", encoding="utf-8").write("## " + body)
          PY

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
